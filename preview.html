<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>糖心志者界面预览</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #402250; font-family: "Microsoft YaHei", sans-serif; background: linear-gradient(145deg, #fff7fb, #f6f0ff); }
      .preview-site { max-width: 1100px; margin: 0 auto; padding: 28px; }
      .preview-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .preview-card { margin-top: 24px; min-height: 420px; padding: 24px; border: 1px solid #f3d7e8; border-radius: 28px; background: rgba(255,255,255,.78); box-shadow: 0 18px 60px rgba(147,51,234,.08); }
      .preview-line { height: 14px; margin: 14px 0; border-radius: 999px; background: #f5e8f4; }
    </style>
  </head>
  <body>
    <!-- 预览页模拟目标网站底层内容，便于检查蒙版、悬浮球和移动端覆盖关系。 -->
    <main class="preview-site">
      <div class="preview-header"><h1>本地界面预览</h1><span>模拟网站内容</span></div>
      <section class="preview-card">
        <h2>视频详情区域</h2>
        <div class="preview-line" style="width: 82%"></div>
        <div class="preview-line" style="width: 64%"></div>
        <div class="preview-line" style="width: 74%"></div>
      </section>
    </main>
    <script>
      // 同时兼容回调和 Promise 两种扩展存储调用方式。
      const previewStorage = {};
      window.chrome = window.chrome || {};
      window.chrome.runtime = {
        getURL: (path) => `/${path}`,
        sendMessage: async (message) => {
          if (message?.type === "checkRemoteDiagnostics") {
            return {
              ok: true,
              baseUrl: "https://worker.example.com",
              diagnostics: {
                level: "ok",
                score: 96,
                summary: "云端服务状态良好，服务配置、数据库和账号池均可用。",
                checkedAt: new Date().toISOString(),
                checks: [
                  { key: "env", label: "运行密钥", level: "ok", message: "必填密钥已配置完整。" },
                  { key: "database", label: "数据库连接", level: "ok", message: "数据库读取正常。" },
                  { key: "accounts", label: "账号池数量", level: "ok", message: "共有 3 个账号，启用 3 个。" }
                ],
                suggestions: ["当前无需处理，可定期重新体检。"],
                accountsSummary: { total: 3, enabled: 3, ok: 2, error: 0, unverified: 1, avgCoin: 68 }
              }
            };
          }
          return { ok: true };
        }
      };
      window.chrome.storage = {
        local: {
          get: (keys, callback) => {
            const names = Array.isArray(keys) ? keys : typeof keys === "string" ? [keys] : Object.keys(keys || {});
            const result = Object.fromEntries(names.map((name) => [name, previewStorage[name]]));
            callback?.(result);
            return Promise.resolve(result);
          },
          set: (items, callback) => {
            Object.assign(previewStorage, items || {});
            callback?.();
            return Promise.resolve();
          },
          remove: (keys, callback) => {
            for (const key of Array.isArray(keys) ? keys : [keys]) delete previewStorage[key];
            callback?.();
            return Promise.resolve();
          }
        }
      };

      const previewScenario = new URLSearchParams(location.search).get("scenario") || "normal";
      const previewVideo = "https://media.w3.org/2010/05/sintel/trailer.mp4";
      const failedVideo = `${location.origin}/preview-missing-${previewScenario}.mp4`;
      const makeSession = (overrides = {}) => ({
        id: `preview-${previewScenario}`,
        movieId: "9527",
        title: "星糖列车与月亮放映厅",
        phase: "ready",
        sources: [
          { id: "primary", label: "主线路", url: previewVideo, protocol: "progressive", health: { state: "healthy", status: 200, latencyMs: 86, score: 220 } },
          { id: "backup", label: "备用线路", url: previewVideo, protocol: "progressive", health: { state: "unknown", score: 20 } }
        ],
        decision: { recommendedSourceId: "primary", reasonCodes: ["healthy-source"], failoverAllowed: true },
        account: { id: "cloud-1", label: "云端 VIP 一号" },
        acquisition: { mode: "direct", attempts: 2, failed: [] },
        fetchedAt: new Date().toISOString(),
        expiresAt: new Date(Date.now() + 600000).toISOString(),
        ...overrides
      });
      const normalSession = makeSession();
      const historySession = makeSession({ id: "preview-history", movieId: "2048", title: "棉花糖云海巡游", fetchedAt: new Date(Date.now() - 86400000).toISOString() });
      const fixtureSession = previewScenario === "duration-mismatch"
        ? makeSession({
            sources: [
              { id: "primary", label: "主线路", url: previewVideo, protocol: "progressive", health: { state: "healthy", status: 200, duration: 1020, segments: 170, latencyMs: 30 } },
              { id: "backup", label: "备用线路", url: previewVideo, protocol: "progressive", health: { state: "healthy", status: 200, duration: 3600, segments: 600, latencyMs: 900 } }
            ],
            decision: { recommendedSourceId: "backup", reasonCodes: ["longer-playlist-duration", "healthy-source"], failoverAllowed: true }
          })
        : previewScenario === "primary-failure"
        ? makeSession({
            sources: [
              { id: "primary", label: "主线路", url: failedVideo, protocol: "progressive", health: { state: "degraded", status: 503, score: 90 } },
              { id: "backup", label: "备用线路", url: previewVideo, protocol: "progressive", health: { state: "healthy", status: 200, score: 180 } }
            ],
            decision: { recommendedSourceId: "primary", reasonCodes: ["preview-primary-failure"], failoverAllowed: true }
          })
        : previewScenario === "double-failure"
          ? makeSession({
              sources: [
                { id: "primary", label: "主线路", url: `${failedVideo}?line=1`, protocol: "progressive", health: { state: "failed", error: "preview" } },
                { id: "backup", label: "备用线路", url: `${failedVideo}?line=2`, protocol: "progressive", health: { state: "failed", error: "preview" } }
              ],
              decision: { recommendedSourceId: "primary", reasonCodes: ["preview-double-failure"], failoverAllowed: true }
            })
          : previewScenario === "coin-unlock"
            ? makeSession({ acquisition: { mode: "purchased", attempts: 3, failed: [{ accountId: "cloud-2", stage: "detail", message: "仅返回锁定详情" }], purchase: { status: "resolved", accountId: "cloud-1", price: 18 } } })
            : previewScenario === "buffering"
              ? makeSession({ sources: [{ id: "primary", label: "缓冲演练线", url: failedVideo, protocol: "progressive", health: { state: "probing" } }], decision: { recommendedSourceId: "primary", reasonCodes: ["preview-buffering"], failoverAllowed: false } })
              : normalSession;
      const previewRequest = previewScenario === "buffering"
        ? { phase: "resolving", requestId: "preview-buffering", movieId: "9527", startedAt: new Date().toISOString() }
        : { phase: "idle" };
      const previewReconciliationItems = [
        { origin: "cloud", attemptId: "attempt-charged", requestId: "request-charged", movieId: "9527", status: "charged", price: 18, account: { id: "cloud-1", label: "云端 VIP 一号" }, error: "扣费后详情刷新超时，等待原账号重新核对", createdAt: new Date(Date.now() - 240000).toISOString(), updatedAt: new Date(Date.now() - 180000).toISOString(), canReconcile: true },
        { origin: "local", attemptId: "attempt-uncertain", requestId: "request-uncertain", movieId: "2048", status: "uncertain", price: 12, account: { id: "local-1", label: "本地测试账号" }, error: "页面在扣费确认后关闭，结果保持不确定", createdAt: new Date(Date.now() - 360000).toISOString(), updatedAt: new Date(Date.now() - 300000).toISOString(), canReconcile: true },
        { origin: "cloud", attemptId: "attempt-pending", requestId: "request-pending", movieId: "4096", status: "pending", price: 9, account: { id: "cloud-2", label: "云端备用账号" }, createdAt: new Date(Date.now() - 45000).toISOString(), updatedAt: new Date(Date.now() - 45000).toISOString(), canReconcile: false }
      ];
      if (previewScenario === "fullscreen-failure") {
        Element.prototype.requestFullscreen = () => Promise.reject(new Error("预览场景：系统全屏被拒绝"));
      }

      window.__txzzBridgeState = {
        expanded: true,
        role: "full",
        displayPatchApplied: true,
        session: { userId: "10086", nickname: "预览用户", tokenMasked: "abcd...wxyz", hasToken: true, deviceId: "web_preview" },
        remote: {
          baseUrl: "https://worker.example.com",
          accountSourceMode: "cloud",
          lastSyncAt: new Date(Date.now() - 120000).toISOString()
        },
        accountPool: [
          { id: "cloud-1", label: "云端 VIP 一号", username: "vip001", source: "remote", cloudReadonly: true, status: "ok", hasToken: true, tokenMasked: "12ab...98zy", lastVerifiedAt: new Date().toISOString(), userInfo: { is_vip: true, is_dark_vip: true, coin: 128 } },
          { id: "cloud-2", label: "云端备用账号", username: "vip002", source: "remote", cloudReadonly: true, status: "idle", hasPassword: true, userInfo: { is_vip: true, coin: 26 } },
          { id: "local-1", label: "本地测试账号", username: "local001", source: "manual", status: "ok", hasPassword: true, notes: "用于本机兜底" }
        ],
        selectedFullAccountId: "local-1",
        fullDetails: [{ movieId: "9527", movieTitle: fixtureSession.title, accountLabel: "云端 VIP 一号", action: fixtureSession.acquisition.mode === "purchased" ? "buy_then_full_detail" : "direct_full_detail", playLink: fixtureSession.sources[0]?.url || "", backupLink: fixtureSession.sources[1]?.url || "", fetchedAt: fixtureSession.fetchedAt }],
        screening: {
          schemaVersion: 2,
          activeSession: fixtureSession,
          history: previewScenario === "history" ? [historySession, fixtureSession] : [fixtureSession],
          request: previewRequest
        },
        downloadTasks: {
          task_preview: { taskId: "task_preview", attemptId: "attempt_preview", sequence: 18, movieId: "9527", movieTitle: "预览视频", mode: "hls-opfs", format: "mp4", lineKey: "primary", url: previewVideo, stage: "downloading", current: 18, total: 40, bytes: 188743680, totalBytes: 419430400, percent: 45, speedBps: 2457600, updatedAt: new Date().toISOString() }
        },
        downloadPlanner: null,
        purchaseReconciliation: { items: previewReconciliationItems, loading: false, checkedAt: new Date().toISOString() },
        repositoryUpdate: { ok: true, checkPhase: "success", downloadPhase: "idle", checkedAt: new Date().toISOString(), updateAvailable: false, local: { version: "5.1.0", build: "2026-07-27-1925" }, remote: { version: "5.1.0", build: "2026-07-27-1925" } },
        adCleaner: { enabled: true, version: "v3", total: 12, removed: 8, blockedClicks: 3, splashHits: 1, countdownHits: 1, selectors: 1, lastRunAt: new Date().toISOString() },
        flow: [{ title: "本地预览", detail: `糖果影院确定性场景：${previewScenario}`, level: "ok", ts: new Date().toISOString() }]
      };

      window.addEventListener("txzz:ui-ready", () => {
        window.dispatchEvent(new CustomEvent("txzz:state", { detail: window.__txzzBridgeState }));
      });
      window.addEventListener("txzz:ui-action", (event) => {
        const action = event.detail?.action || "操作";
        const payload = event.detail?.payload || {};
        const now = new Date().toISOString();
        const current = window.__txzzBridgeState;
        let next = { ...current };

        if (action === "plan-full-video-download") {
          const source = fixtureSession.sources.find((item) => item.id === payload.sourceId)
            || fixtureSession.sources.find((item) => item.id === fixtureSession.decision.recommendedSourceId)
            || fixtureSession.sources[0];
          next.downloadPlanner = {
            open: true,
            movieId: payload.movieId || fixtureSession.movieId,
            movieTitle: fixtureSession.title,
            taskId: "task_planned",
            lineKey: source?.id || "auto",
            mode: "hls-opfs",
            filename: `${fixtureSession.title}.mp4`,
            source: { id: source?.id, label: source?.label, protocol: source?.protocol },
            sources: fixtureSession.sources.map((item, index) => ({ id: item.id, label: item.label, role: index ? "backup" : "primary", protocol: item.protocol, health: item.health })),
            plan: {
              playlistUrl: source?.url || previewVideo,
              selectedVariant: { id: "720p", height: 720, bandwidth: 2400000 },
              variants: [
                { id: "480p", height: 480, bandwidth: 1200000 },
                { id: "720p", height: 720, bandwidth: 2400000 },
                { id: "1080p", height: 1080, bandwidth: 5200000 }
              ],
              durationSeconds: 3568,
              container: "mpeg-ts",
              audioMode: "muxed",
              segmentCount: 86,
              estimatedBytes: 333447168,
              requiredBytes: 383464243,
              storage: { known: true, quota: 2147483648, usage: 536870912, available: 1610612736 },
              compatibleContainers: ["mp4", "ts"]
            }
          };
        }
        if (action === "close-download-planner") next.downloadPlanner = null;
        if (action === "start-planned-download") {
          next.downloadPlanner = null;
          next.downloadTasks = {
            ...(current.downloadTasks || {}),
            task_planned: {
              taskId: "task_planned",
              attemptId: `attempt_${Date.now()}`,
              sequence: 1,
              movieId: payload.movieId || fixtureSession.movieId,
              movieTitle: fixtureSession.title,
              mode: "hls-opfs",
              format: payload.container || "mp4",
              lineKey: payload.sourceId || "primary",
              url: previewVideo,
              stage: "queued",
              current: 0,
              total: 86,
              percent: 0,
              bytes: 0,
              totalBytes: 333447168,
              updatedAt: now
            }
          };
        }
        if (["pause-download-task", "resume-download-task", "cancel-download-task"].includes(action)) {
          const taskId = payload.taskId || Object.keys(current.downloadTasks || {})[0] || "";
          const task = current.downloadTasks?.[taskId];
          if (task) {
            const stage = action === "pause-download-task" ? "paused" : action === "resume-download-task" ? "recovering" : "cancelled";
            next.downloadTasks = { ...current.downloadTasks, [taskId]: { ...task, sequence: Number(task.sequence || 0) + 1, stage, updatedAt: now } };
          }
        }
        if (action === "load-purchase-reconciliation") {
          next.purchaseReconciliation = { ...(current.purchaseReconciliation || {}), loading: false, checkedAt: now };
        }
        if (action === "reconcile-purchase") {
          const attemptId = payload.attemptId || current.purchaseReconciliation?.items?.find((item) => item.canReconcile)?.attemptId || "";
          next.purchaseReconciliation = {
            ...(current.purchaseReconciliation || {}),
            items: (current.purchaseReconciliation?.items || []).filter((item) => item.attemptId !== attemptId),
            loading: false,
            checkedAt: now
          };
        }

        next.flow = [...(current.flow || []), { title: "操作反馈", detail: `已触发：${action}`, level: "ok", ts: now }];
        window.__txzzBridgeState = next;
        document.documentElement.dataset.txzzPreviewLastAction = action;
        document.documentElement.dataset.txzzPreviewTaskStage = String(Object.values(next.downloadTasks || {})[0]?.stage || "");
        document.documentElement.dataset.txzzPreviewReconciliationCount = String(next.purchaseReconciliation?.items?.length || 0);
        window.dispatchEvent(new CustomEvent("txzz:state", { detail: window.__txzzBridgeState }));
      });
    </script>
    <script type="module" src="/ui-src/main.tsx"></script>
  </body>
</html>
