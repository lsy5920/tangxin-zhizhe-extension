<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>糖心志者 · 保存到设备</title>
  <link rel="stylesheet" href="save.css">
</head>
<body>
  <main class="ticket" aria-live="polite">
    <div class="mascot" aria-hidden="true">🍬</div>
    <p class="eyebrow">糖果影院 · 安全保存页</p>
    <h1 id="title">正在领取保存票…</h1>
    <p id="message" class="message">请稍候，糖糖正在核对下载成品。</p>
    <dl id="details" class="details" hidden>
      <div><dt>文件</dt><dd id="filename">—</dd></div>
      <div><dt>大小</dt><dd id="filesize">—</dd></div>
      <div><dt>校验</dt><dd id="verification">待检查</dd></div>
    </dl>
    <div class="actions">
      <button id="save" type="button" disabled>保存到设备</button>
      <button id="confirm" class="secondary" type="button" hidden>我已看到保存的文件</button>
    </div>
    <p class="hint">文件只从扩展自己的 OPFS 读取，不会通过消息传输整包 Base64。同一张票只允许一个标签领取；领取后的原标签可刷新或重试。</p>
  </main>
  <script src="save.js"></script>
</body>
</html>
